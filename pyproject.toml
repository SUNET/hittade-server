[project]
name = "hittade-server"
authors = [{name = "Kushal Das", email = "kushal@sunet.se"}]
version = "0.1.0"
description = "Django web application to show the state of various hosts and containers"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"

dependencies = [
    "django==6.1.2",
    "django-types",
    "django-ninja",
    "django-extensions",
    "orjson",
    "redis",
    "pytz",
    "psycopg2-binary",
    "pysaml2",
    "djangosaml2",
    "lib4sbom",
    "whitenoise>=6.12.0",
    "granian>=2.7.5",
]

[project.optional-dependencies]
dev = [
    "black",
    "fakeredis[lua]>=2.39.0",
    "pytest>=9.0.3",
    "pytest-django>=4.12.0",
    "ruff",
]

[project.urls]
Home = "https://github.com/SUNET/hittade-server"

[tool.uv]
# Supply-chain cooling window: never resolve distributions published after
# this date. A fixed UTC timestamp (not a rolling span, and not a bare
# date which uv resolves against the local timezone) keeps `uv sync
# --locked` builds reproducible across hosts and the UTC build container.
# Bump deliberately when updating dependencies.
exclude-newer = "2026-10-09T00:00:00Z"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "hittade.settings_test"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
exclude = [
    "db",
    "redis",
    ".git",
    ".ruff_cache",
    ".venv",
    "migrations",
]

[tool.ruff.lint.per-file-ignores]
# Django reads Meta options such as indexes as plain class attributes.
"*/models.py" = ["RUF012"]
# The test settings extend the normal settings with a wildcard import.
"hittade/settings_test.py" = ["F403"]

[tool.ruff.lint.isort]
# ./redis is the docker compose data dir, not the redis package.
known-third-party = ["redis"]
