publiccodeYmlVersion: "0"

name: hittade-server
url: "https://github.com/SUNET/hittade-server"
platforms:
  - web

categories:
  - it-asset-management
  - it-security

usedBy:
  - Sunet

developmentStatus: beta

softwareType: "standalone/web"

description:
  en:
    shortDescription: >
        Inventory of linux hosts and containers.

    longDescription: >
        A small Django based web application that parses input JSON files
        describing Linux servers and containers (using redis/valkey for
        caching) and exposes their state, installed packages and other
        host details via a searchable web interface.
    features:
      - server inventory
      - container inventory
      - package searching

